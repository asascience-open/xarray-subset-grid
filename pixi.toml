[workspace]
name = "xarray_subset_grid"
channels = [ "conda-forge" ]
platforms = [
    "linux-64",
    { platform = "osx-64", macos="14.0" },
    { platform = "osx-arm64", macos="14.0" },
    "win-64",
]

[pypi-dependencies]
xarray_subset_grid = { path = ".", editable = true, extras = ["dev"] }

[dependencies]
python = "*"

[environments]
default = { solve-group = "default" }
dev = { features = [ "dev" ], solve-group = "default" }
test310 = [ "dev", "py310" ]  # implicit: test310 = ["dev", "py310", "default"]
test311 = [ "dev", "py311" ]
test312 = [ "dev", "py312" ]
test313 = [ "dev", "py313" ]
test314 = [ "dev", "py314" ]
testcov = [ "dev", "py314" ]

[tasks]

[feature.dev.tasks]
lint = "ruff check tests xarray_subset_grid"
pre_commit = "pre-commit run --all-files"
test = { cmd = ["pytest", "tests/"] }
test_all = { cmd = "pytest --online tests/" }
test_cov = { cmd = "pytest --cov=xarray_subset_grid tests" }

[feature.py310.dependencies]
python = "~=3.10"

[feature.py311.dependencies]
python = "~=3.11"

[feature.py312.dependencies]
python = "~=3.12"

[feature.py313.dependencies]
python = "~=3.13"

[feature.py314.dependencies]
python = "~=3.14"
